[package]
name = "minastirith"
version = "0.1.0"
edition = "2024"
description = "A TUI offline publication manager"
authors = ["The Spanish Inquisition"]
exclude = ["./images/*"]
readme = "Readme.md"
repository = "https://github.com/SpanishInquisition49/Minas-Tirith"
keywords = ["TUI", "books"]

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.45", features = ["serde"] }
cli-clipboard = "0.4.0"
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
envy = "0.4.2"
epub = "2.1.5"
figment = { version = "0.10.19", features = ["env", "toml"] }
futures = "0.3.32"
human_name = "2.0.4"
image = "0.25.10"
opener = "0.8.5"
ratatui = "0.30.2"
ratatui-explorer = "0.3.0"
ratatui-image = { version = "11.0.6", features = [
  "crossterm",
  "tokio",
  "image-defaults",
] }
ratatui-notifications = "0.1.0"
ratatui-textarea = "0.9.2"
reqwest = { version = "0.13.4", features = ["json", "query"] }
rustix = "1.1.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
slug = "0.1.6"
sqlx = { version = "0.9.0", features = [
  "chrono",
  "json",
  "macros",
  "runtime-tokio",
  "sqlite",
] }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
trait-variant = "0.1.2"
tui-input = "0.15.3"
